<body>
<aside class="sidebar"><a class="brand" href="#home"><span class="brand-mark">s.</span><span>soon<span class="brand-dot">.</span></span></a><div class="side-label">LIBRARY</div><nav><button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>홈</button><button class="nav-item" data-view="songs"><span class="nav-icon">♫</span>내 음악 <span class="nav-count" id="songCount">0</span></button><button class="nav-item" data-view="playlists"><span class="nav-icon">▤</span>플레이리스트</button></nav><div class="side-rule"></div><div class="playlist-heading"><span class="side-label">내 플레이리스트</span><button class="add-small" id="addPlaylistSide" aria-label="플레이리스트 만들기">＋</button></div><div id="sidePlaylists" class="side-playlists"></div><div class="side-bottom"><div class="storage-card"><div class="storage-orb">♫</div><div><b>내 음악, 오래도록</b><small>업로드한 곡을 안전하게 보관해요.</small></div></div><div class="profile"><div class="avatar">S</div><div class="profile-meta"><b>나의 라이브러리</b><small>개인 음악 보관함</small></div><span class="dots">···</span></div></div></aside>
<main class="main"><header class="topbar"><div class="crumb"><span>SOON</span><i>/</i><b id="crumbTitle">홈</b></div><div class="top-actions"><button class="icon-button" id="searchToggle" title="검색">⌕</button><button class="upload-top" id="uploadTop"><span>＋</span> 음악 업로드</button><div class="top-avatar">S</div></div></header>
<section class="content" id="content"></section></main>
<footer class="player"><div class="now-playing"><div class="mini-art" id="miniArt"><span>♫</span></div><div class="now-meta"><b id="nowTitle">재생할 음악을 선택해 주세요</b><small id="nowArtist">내 라이브러리</small></div><button class="like-btn" id="likeBtn" title="좋아요">♡</button></div><div class="player-center"><div class="controls"><button class="ctrl" id="shuffleBtn" title="무작위">⤨</button><button class="ctrl" id="prevBtn" title="이전 곡">|◀</button><button class="play-btn" id="playBtn" title="재생">▶</button><button class="ctrl" id="nextBtn" title="다음 곡">▶|</button><button class="ctrl" id="repeatBtn" title="반복">↻</button></div><div class="timeline"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div></div><div class="player-extra"><span class="volume-icon">◖))</span><input id="volume" type="range" min="0" max="1" step=".01" value=".8"><button class="queue-btn" title="재생 목록">☷</button></div><audio id="audio"></audio></footer>
<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac,.opus" multiple hidden>
<div class="toast" id="toast"></div><div class="modal-backdrop" id="modal" hidden><div class="modal"><button class="modal-close" id="modalClose">×</button><div class="modal-icon">♫</div><h2>새 플레이리스트</h2><p>지금 듣고 싶은 음악을 한곳에 모아보세요.</p><input id="playlistName" maxlength="60" placeholder="예: 늦은 밤의 재즈"><button class="primary-btn modal-submit" id="createPlaylist">플레이리스트 만들기</button></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={tracks:[],playlists:[],view:'home',selected:null,current:null,queue:[],search:'',shuffle:false,repeat:false};
const audio=$('#audio');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{if(!Number.isFinite(n))return'0:00';return `${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`};
async function api(url,options={}){const r=await fetch(url,options);if(!r.ok){const e=await r.json().catch(()=>({}));throw Error(e.error||'요청을 처리하지 못했어요.')}return r.status===204?null:r.json()}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function cover(i=0){return `<div class="cover c${i%4+1}">♫</div>`}
function setView(view,selected=null){state.view=view;state.selected=selected;render()}
function render(){const c=$('#content');$('#crumbTitle').textContent=state.view==='home'?'홈':state.view==='songs'?'내 음악':state.view==='playlists'?'플레이리스트':(state.playlists.find(p=>p.id===state.selected)?.name||'플레이리스트');$('#songCount').textContent=state.tracks.length;$('#sidePlaylists').innerHTML=state.playlists.map(p=>`<button class="side-pl ${state.selected===p.id?'selected':''}" data-pl="${p.id}">${esc(p.name)}</button>`).join('');$$('[data-pl]').forEach(b=>b.onclick=()=>setView('detail',b.dataset.pl));
  if(state.view==='home') c.innerHTML=home(); else if(state.view==='songs') c.innerHTML=songsPage(); else if(state.view==='playlists') c.innerHTML=playlistsPage(); else c.innerHTML=detailPage();
  bindContent();
}
function home(){const newest=state.tracks.slice(0,4);return `<div class="hero-row"><div><div class="greeting">YOUR MUSIC, YOUR SPACE</div><h1 class="hero-title">오늘은 어떤 음악을<br><em>꺼내 들을까요?</em></h1><p class="hero-copy">좋아하는 곡을 모으고, 오래 간직하고, 어디서든 들어보세요.</p></div><button class="primary-btn hero-upload" id="heroUpload"><span>＋</span> 음악 업로드</button></div><div class="hero-banner"><div class="banner-text"><div class="eyebrow">MADE FOR YOUR MOMENTS</div><h2>내 음악의 새로운 보금자리</h2><p>업로드한 음악을 한곳에 보관하고<br>나만의 플레이리스트로 정리해보세요.</p></div><div class="banner-disc"><span class="disc-center"></span></div></div><div class="section-head"><h2>최근 추가한 음악</h2><button class="text-link" data-goto="songs">모두 보기&nbsp; ↗</button></div>${newest.length?`<div class="quick-grid">${newest.map((t,i)=>`<div class="quick-card" data-play="${t.id}">${cover(i)}<div class="quick-copy"><b>${esc(t.name)}</b><small>${esc(t.artist||'내 음악')}</small></div><button class="mini-play">▶</button></div>`).join('')}</div>`:`<div class="empty"><div><div class="empty-mark">♫</div><b>아직 음악이 없어요</b><p>첫 번째 음악을 올려 나만의 라이브러리를 시작해보세요.</p><button class="primary-btn" id="emptyUpload">음악 업로드</button></div></div>`}<div class="section-head"><h2>내 플레이리스트</h2><button class="text-link" data-goto="playlists">모두 보기&nbsp; ↗</button></div>${state.playlists.length?`<div class="playlist-grid">${state.playlists.slice(0,4).map(p=>`<div class="pl-card" data-pl="${p.id}"><div class="pl-art">♫</div><h3>${esc(p.name)}</h3><small>${p.trackIds.length}곡 · 내 플레이리스트</small></div>`).join('')}</div>`:`<div class="empty"><div><b>취향을 담은 플레이리스트</b><p>분위기에 맞춰 음악을 모아보세요.</p><button class="secondary-btn" id="emptyPlaylist">＋ 플레이리스트 만들기</button></div></div>`}`}
function table(tracks){if(!tracks.length)return `<div class="empty"><div><b>표시할 음악이 없어요</b><p>음악을 업로드하면 이곳에서 재생하고 정리할 수 있어요.</p><button class="primary-btn" id="emptyUpload">음악 업로드</button></div></div>`;return `<table class="track-table"><thead><tr><th style="width:45px">#</th><th>제목</th><th>추가한 날짜</th><th>재생 시간</th><th></th></tr></thead><tbody>${tracks.map((t,i)=>`<tr class="track-row ${state.current===t.id?'playing':''}" data-play="${t.id}"><td>${state.current===t.id?'♫':String(i+1).padStart(2,'0')}</td><td><div class="track-title-cell"><div class="track-art">♫</div><div>${esc(t.name)}<div style="color:#85877e;font-size:10px;margin-top:4px">${esc(t.artist||'내 음악')}</div></div></div></td><td>${t.addedAt?new Date(t.addedAt).toLocaleDateString('ko-KR',{month:'short',day:'numeric'}):'—'}</td><td>${t.duration?fmt(t.duration):'—'}</td><td><div class="row-actions"><button data-add="${t.id}" title="플레이리스트에 추가">＋</button><button data-share="${t.id}" title="음악 공유">↗</button></div></td></tr>`).join('')}</tbody></table>`}
function songsPage(){const tracks=state.tracks.filter(t=>(t.name+' '+(t.artist||'')).toLowerCase().includes(state.search.toLowerCase()));return `<div class="section-head"><div><h1 class="page-title">내 음악</h1><p class="page-sub">내가 업로드한 음악 ${state.tracks.length}곡</p></div><button class="primary-btn" id="pageUpload">＋ 음악 업로드</button></div><div class="section-head"><span class="side-label">전체 트랙</span><input class="search-box" id="searchInput" placeholder="음악 검색하기" value="${esc(state.search)}"></div>${table(tracks)}`}
function playlistsPage(){return `<div class="section-head"><div><h1 class="page-title">플레이리스트</h1><p class="page-sub">순간과 취향을 음악으로 정리해보세요.</p></div><button class="primary-btn" id="pageNewPlaylist">＋ 새 플레이리스트</button></div>${state.playlists.length?`<div class="playlist-grid">${state.playlists.map(p=>`<div class="pl-card" data-pl="${p.id}"><div class="pl-art">♫</div><h3>${esc(p.name)}</h3><small>${p.trackIds.length}곡 · 나의 라이브러리</small></div>`).join('')}</div>`:`<div class="empty"><div><div class="empty-mark">▤</div><b>아직 플레이리스트가 없어요</b><p>좋아하는 음악을 모아 나만의 목록을 만들어보세요.</p><button class="primary-btn" id="emptyPlaylist">＋ 플레이리스트 만들기</button></div></div>`}`}
function detailPage(){const p=state.playlists.find(x=>x.id===state.selected);if(!p)return playlistsPage();const list=p.trackIds.map(id=>state.tracks.find(t=>t.id===id)).filter(Boolean);return `<div class="playlist-detail"><div class="detail-art">♫</div><div class="detail-info"><div class="eyebrow">PLAYLIST</div><h1>${esc(p.name)}</h1><p>${list.length}곡 · ${new Date(p.createdAt).toLocaleDateString('ko-KR')}</p><div class="detail-actions"><button class="primary-btn" id="playPlaylist">▶&nbsp; 재생</button><button class="secondary-btn" id="sharePlaylist">↗&nbsp; 공유하기</button><button class="secondary-btn" id="renamePlaylist">이름 수정</button></div></div></div><div class="section-head"><h2>플레이리스트 음악</h2><button class="text-link" id="addSongs">＋ 음악 추가</button></div>${table(list)}${list.length?`<button class="secondary-btn" id="deletePlaylist" style="margin-top:24px">플레이리스트 삭제</button>`:''}`}
function bindContent(){const bind=(s,fn)=>{const e=$(s);if(e)e.onclick=fn};bind('#heroUpload',()=>$('#fileInput').click());bind('#pageUpload',()=>$('#fileInput').click());bind('#emptyUpload',()=>$('#fileInput').click());bind('#pageNewPlaylist',openModal);bind('#emptyPlaylist',openModal);bind('#searchInput',e=>{});const search=$('#searchInput');if(search)search.oninput=e=>{state.search=e.target.value;const pos=e.target.selectionStart;render();const n=$('#searchInput');n.focus();n.setSelectionRange(pos,pos)};
  $$('[data-play]').forEach(e=>e.onclick=()=>play(e.dataset.play));$$('[data-goto]').forEach(e=>e.onclick=()=>setView(e.dataset.goto));$$('[data-pl]').forEach(e=>e.onclick=()=>setView('detail',e.dataset.pl));$$('[data-share]').forEach(e=>e.onclick=x=>{x.stopPropagation();shareTrack(e.dataset.share)});$$('[data-add]').forEach(e=>e.onclick=x=>{x.stopPropagation();addTrackMenu(e.dataset.add)});
  bind('#playPlaylist',()=>{const p=state.playlists.find(x=>x.id===state.selected);if(p){state.queue=p.trackIds.filter(id=>state.tracks.some(t=>t.id===id));play(state.queue[0])}});bind('#sharePlaylist',()=>sharePlaylist(state.selected));bind('#addSongs',()=>addSongsTo(state.selected));bind('#renamePlaylist',()=>renamePlaylist(state.selected));bind('#deletePlaylist',()=>deletePlaylist(state.selected));}
function openModal(){$('#modal').hidden=false;$('#playlistName').value='';$('#playlistName').focus()}function closeModal(){$('#modal').hidden=true}
async function createPlaylist(){const name=$('#playlistName').value.trim();if(!name){$('#playlistName').focus();return}try{const p=await api('/api/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});state.playlists.unshift(p);closeModal();setView('detail',p.id);toast('플레이리스트를 만들었어요.')}catch(e){toast(e.message)}}
async function patchPlaylist(id,data){try{const p=await api(`/api/playlists/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});state.playlists=state.playlists.map(x=>x.id===id?p:x);render();return p}catch(e){toast(e.message)}}
async function renamePlaylist(id){const p=state.playlists.find(x=>x.id===id),name=prompt('플레이리스트 이름',p?.name);if(name?.trim())await patchPlaylist(id,{name:name.trim()})}
async function deletePlaylist(id){const p=state.playlists.find(x=>x.id===id);if(!p||!confirm(`“${p.name}” 플레이리스트를 삭제할까요?`))return;try{await api(`/api/playlists/${id}`,{method:'DELETE'});state.playlists=state.playlists.filter(x=>x.id!==id);setView('playlists');toast('플레이리스트를 삭제했어요.')}catch(e){toast(e.message)}}
async function addTrackMenu(trackId){if(!state.playlists.length){if(confirm('먼저 플레이리스트를 만들까요?'))openModal();return}const names=state.playlists.map((p,i)=>`${i+1}. ${p.name}`).join('\n'),v=prompt(`추가할 플레이리스트 번호를 입력해 주세요.\n${names}`);const p=state.playlists[Number(v)-1];if(p){await patchPlaylist(p.id,{trackIds:[...p.trackIds,trackId]});toast('플레이리스트에 추가했어요.')}}
async function addSongsTo(id){if(!state.tracks.length)return toast('먼저 음악을 업로드해 주세요.');const p=state.playlists.find(x=>x.id===id);const opts=state.tracks.map((t,i)=>`${i+1}. ${t.name}`).join('\n');const nums=prompt(`추가할 곡 번호를 쉼표로 입력해 주세요.\n${opts}`);if(!nums)return;const ids=nums.split(',').map(n=>state.tracks[Number(n.trim())-1]?.id).filter(Boolean);await patchPlaylist(id,{trackIds:[...p.trackIds,...ids]});toast('음악을 추가했어요.')}
async function sharePlaylist(id){const p=state.playlists.find(x=>x.id===id);if(!p)return;const url=new URL(location.href);url.search='';url.searchParams.set('playlist',id);await copy(url.href,'공유 링크를 복사했어요. 다른 사람도 이 사이트에서 재생할 수 있어요.')}
async function shareTrack(id){const t=state.tracks.find(x=>x.id===id);if(!t)return;const url=new URL(t.url,location.origin).href;await copy(url,'음악 스트리밍 링크를 복사했어요.')}
async function copy(text,msg){try{await navigator.clipboard.writeText(text)}catch{prompt('링크를 복사해 주세요',text);return}toast(msg)}
async function upload(files){const audioFiles=[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|aac|wav|ogg|flac|opus|webm)$/i.test(f.name));if(!audioFiles.length)return toast('음악 파일을 선택해 주세요.');toast(`${audioFiles.length}개 파일을 업로드하고 있어요…`);for(const f of audioFiles){const fd=new FormData();fd.append('file',f,f.name);try{const r=await api('/api/upload',{method:'POST',body:fd});state.tracks.unshift(...r.tracks)}catch(e){toast(`${f.name}: ${e.message}`);return}}render();toast(`${audioFiles.length}곡을 보관함에 추가했어요.`)}
function play(id){const t=state.tracks.find(x=>x.id===id);if(!t)return;if(state.current===id){audio.paused?audio.play():audio.pause();return}state.current=id;audio.src=t.url;audio.play().catch(()=>toast('이 파일 형식은 브라우저에서 재생하지 못할 수 있어요.'));$('#nowTitle').textContent=t.name;$('#nowArtist').textContent=t.artist||'내 음악';$('#miniArt').innerHTML='<span>♫</span>';$('#playBtn').textContent='Ⅱ';if(!state.queue.length)state.queue=state.tracks.map(x=>x.id);render()}
function next(dir=1){if(!state.queue.length)state.queue=state.tracks.map(x=>x.id);if(!state.queue.length)return;let i=state.queue.indexOf(state.current);let n=(i+dir+state.queue.length)%state.queue.length;if(state.shuffle)n=Math.floor(Math.random()*state.queue.length);play(state.queue[n])}
$('#fileInput').onchange=e=>{if(e.target.files.length)upload(e.target.files);e.target.value=''};$('#uploadTop').onclick=()=>$('#fileInput').click();$('#addPlaylistSide').onclick=openModal;$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};$('#createPlaylist').onclick=createPlaylist;$('#playlistName').onkeydown=e=>{if(e.key==='Enter')createPlaylist()};$('#searchToggle').onclick=()=>{setView('songs');setTimeout(()=>$('#searchInput')?.focus(),0)};$('#playBtn').onclick=()=>{if(!state.current){if(state.tracks[0])play(state.tracks[0].id);return}audio.paused?audio.play():audio.pause()};$('#prevBtn').onclick=()=>next(-1);$('#nextBtn').onclick=()=>next();$('#shuffleBtn').onclick=()=>{$('#shuffleBtn').classList.toggle('on');state.shuffle=!state.shuffle};$('#repeatBtn').onclick=()=>{$('#repeatBtn').classList.toggle('on');state.repeat=!state.repeat};$('#volume').oninput=e=>audio.volume=Number(e.target.value);$('#seek').oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*Number(e.target.value)/100};audio.ontimeupdate=()=>{$('#currentTime').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration);$('#seek').value=audio.duration?audio.currentTime/audio.duration*100:0};audio.onplay=()=>$('#playBtn').textContent='Ⅱ';audio.onpause=()=>$('#playBtn').textContent='▶';audio.onended=()=>state.repeat?audio.play():next();audio.onloadedmetadata=()=>{const t=state.tracks.find(x=>x.id===state.current);if(t&&!t.duration){t.duration=audio.duration;api('/api/library').then(()=>{});render()}};$$('.nav-item').forEach(b=>b.onclick=()=>setView(b.dataset.view));
async function init(){try{const d=await api('/api/library');state.tracks=d.tracks||[];state.playlists=d.playlists||[]}catch{state.tracks=[];state.playlists=[]}render();const id=new URLSearchParams(location.search).get('playlist');if(id&&state.playlists.some(p=>p.id===id))setView('detail',id)}init();

</script></body></html>
